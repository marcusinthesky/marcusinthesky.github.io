version: 2
updates:
  # One Bun workspace, one lockfile: updating from the workspace root keeps bun.lock in step.
  - package-ecosystem: bun
    directory: /src/typescript
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
