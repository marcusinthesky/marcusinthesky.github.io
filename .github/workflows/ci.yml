name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # The portfolio is served from the root of the user site; there is no base path.
  NEXT_PUBLIC_SITE_URL: https://marcusinthesky.github.io

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run knip
      - run: bun run build
      - run: bun run build-storybook
      - run: bun run test:e2e
      - run: bun run test:lighthouse
      - run: bun --cwd apps/web audit:privacy
      - run: bun --cwd apps/web audit:export
      # Publish exactly the export the gates above exercised.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/typescript/apps/web/out
          include-hidden-files: true

  deploy:
    needs: quality
    if: github.repository == 'marcusinthesky/marcusinthesky.github.io' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
