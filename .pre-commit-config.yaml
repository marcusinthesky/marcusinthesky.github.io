default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.31
    hooks:
      - id: rumdl
  - repo: local
    hooks:
      - id: typescript-check
        name: TypeScript workspace checks
        language: system
        entry: bash -c 'cd src/typescript && bun run check'
        pass_filenames: false
        files: ^src/typescript/
      - id: cv-privacy
        name: Public CV build and privacy check
        language: system
        entry: just cv-check
        pass_filenames: false
        files: ^src/latex/cv/
      - id: nix-check
        name: Nix static analysis
        language: system
        entry: bash -c 'nixfmt --check devenv.nix && statix check devenv.nix && deadnix --fail devenv.nix'
        pass_filenames: false
        files: ^devenv\.nix$
